version: "1.0.1"
name: game-client-base-examples
services:
  user-service:
    build:
      dockerfile: Dockerfile
      context: ./
    ports:
      - "3000:3000"
    networks:
      - mern-app
    volumes:
      - ./server-simulator/:/usr/src/app
      - /usr/src/app/node_modules

  sedie-service:
    build:
      dockerfile: Dockerfile.mock
      context: ../sedie-service
    ports:
      - "5002:5002"
    networks:
      - mern-app
    volumes:
      - ./sedie-service/:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - mongo

  mongo:
    image: mongo:4.4-bionic
    ports:
      - "27017:27017"
    networks:
      - mern-app
    volumes:
      - mongo-data:/data/db
networks:
  mern-app:
    driver: bridge
volumes:
  mongo-data:
    driver: local
